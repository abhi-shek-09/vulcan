services:
  postgres:
    image: postgres:17
    container_name: vulcan-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20

  nats:
    image: nats:latest
    container_name: vulcan-nats

    ports:
      - "4222:4222"

  victoriametrics:
    image: victoriametrics/victoria-metrics
    container_name: vulcan-victoria

    command:
      - "--storageDataPath=/storage"

    ports:
      - "8428:8428"

    volumes:
      - victoria-data:/storage

  grafana:
    image: grafana/grafana:latest
    container_name: vulcan-grafana

    depends_on:
      - victoriametrics

    ports:
      - "3000:3000"

    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning
      - ../grafana/dashboards:/var/lib/grafana/dashboards

  migrate:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile

    container_name: vulcan-migrate

    command: ["goose", "-dir", "migrations", "postgres", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable", "up"]

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  control-plane:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile

    container_name: vulcan-control-plane

    command: server

    restart: on-failure:5

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
      victoriametrics:
        condition: service_started

    ports:
      - "8080:8080"

    environment:
      PORT: "8080"
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      VICTORIA_METRICS_URL: http://victoriametrics:8428
      NATS_URL: nats://nats:4222
      WORKER_CAPACITY_RPS: "100"
      WORKER_BINARY_PATH: /usr/local/bin/worker
      VULCAN_PROJECT_ROOT: /app
      CONTROL_PLANE_URL: http://control-plane:8080

  aggregator:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile

    container_name: vulcan-aggregator

    command: aggregator

    restart: on-failure:5

    depends_on:
      nats:
        condition: service_started
      victoriametrics:
        condition: service_started

    environment:
      NATS_URL: nats://nats:4222
      VICTORIA_METRICS_URL: http://victoriametrics:8428

volumes:
  postgres-data:
  victoria-data: